<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>벽돌깨기</title>
<style>
  :root {
    --bg: #0f1226;
    --panel: #1a1e3a;
    --text: #e8ebff;
    --muted: #9aa3d6;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; gap: 12px; touch-action: none; user-select: none; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.05em; }
  .hud { display: flex; gap: 20px; font-size: 1rem; color: var(--muted); }
  .hud b { color: var(--accent); }
  .wrap { position: relative; width: 100%; max-width: 640px; }
  canvas { display: block; width: 100%; height: auto; background: var(--panel);
    border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; background: rgba(15,18,38,.78);
    border-radius: 12px; text-align: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 2rem; color: var(--accent); }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.6; }
  button { font: inherit; font-size: 1.1rem; padding: 10px 28px; border: 0; border-radius: 999px;
    background: var(--accent); color: #222; font-weight: 700; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  .help { font-size: .85rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <h1>🧱 벽돌깨기</h1>
  <div class="hud">
    <span>점수 <b id="score">0</b></span>
    <span>레벨 <b id="level">1</b></span>
    <span>목숨 <b id="lives">3</b></span>
    <span>최고 <b id="best">0</b></span>
  </div>
  <div class="wrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">벽돌깨기</h2>
      <p id="ov-text">패들로 공을 튕겨 모든 벽돌을 깨세요!<br>아이템: 🟢 패들 확장 · 🔵 멀티볼 · 🔴 목숨 +1</p>
      <button id="ov-btn">시작하기</button>
    </div>
  </div>
  <div class="help">마우스 / 터치 / ← → 키로 이동 · 스페이스·클릭으로 발사 · P 일시정지</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), ovTitle = $('ov-title'), ovText = $('ov-text'), ovBtn = $('ov-btn');

  const COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#9775fa', '#f783ac'];
  const BRICK_COLS = 10, BRICK_H = 20, BRICK_GAP = 6, BRICK_TOP = 60, BRICK_SIDE = 20;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;
  const BALL_R = 7, PADDLE_H = 12, PADDLE_Y = H - 36, BASE_PADDLE_W = 100;

  let best = 0;
  try { best = +localStorage.getItem('brick-best') || 0; } catch (e) {}

  let state, paddle, balls, bricks, drops, particles, keys = {}, running = false, paused = false;

  function newGame() {
    state = { score: 0, level: 1, lives: 3 };
    loadLevel();
  }

  function loadLevel() {
    const rows = Math.min(4 + state.level, 9);
    bricks = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        // 레벨별로 다른 패턴
        if (state.level % 3 === 2 && (r + c) % 2 === 1) continue;
        if (state.level % 3 === 0 && Math.abs(c - 4.5) < r / 2 - 1) continue;
        const hp = state.level >= 3 && r < Math.floor(state.level / 2) ? 2 : 1;
        bricks.push({
          x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          hp, color: COLORS[r % COLORS.length], alive: true
        });
      }
    }
    paddle = { x: W / 2, w: BASE_PADDLE_W, wideTimer: 0 };
    drops = []; particles = [];
    resetBall();
    updateHud();
  }

  function speed() { return 5 + state.level * 0.5; }

  function resetBall() {
    balls = [{ x: paddle.x, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true }];
  }

  function launch() {
    balls.forEach(b => {
      if (!b.stuck) return;
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
      b.vx = Math.cos(a) * speed(); b.vy = Math.sin(a) * speed(); b.stuck = false;
    });
  }

  function updateHud() {
    $('score').textContent = state.score;
    $('level').textContent = state.level;
    $('lives').textContent = state.lives;
    $('best').textContent = best;
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title; ovText.innerHTML = text; ovBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  function burst(x, y, color) {
    for (let i = 0; i < 10; i++) {
      particles.push({ x, y, vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5, life: 30, color });
    }
  }

  function hitBrick(br) {
    br.hp--;
    if (br.hp > 0) { state.score += 5; return; }
    br.alive = false;
    state.score += 10 * state.level;
    burst(br.x + BRICK_W / 2, br.y + BRICK_H / 2, br.color);
    if (Math.random() < 0.15) {
      const types = ['wide', 'wide', 'multi', 'multi', 'life'];
      drops.push({ x: br.x + BRICK_W / 2, y: br.y + BRICK_H / 2, type: types[Math.floor(Math.random() * types.length)] });
    }
  }

  function update() {
    // 키보드 이동
    const kSpeed = 9;
    if (keys.ArrowLeft) paddle.x -= kSpeed;
    if (keys.ArrowRight) paddle.x += kSpeed;
    if (paddle.wideTimer > 0 && --paddle.wideTimer === 0) paddle.w = BASE_PADDLE_W;
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

    for (const b of balls) {
      if (b.stuck) { b.x = paddle.x; b.y = PADDLE_Y - BALL_R - 1; continue; }

      // 터널링 방지를 위해 여러 단계로 나눠 이동
      const steps = Math.ceil(Math.hypot(b.vx, b.vy) / 3);
      for (let s = 0; s < steps; s++) {
        b.x += b.vx / steps; b.y += b.vy / steps;

        if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
        if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
        if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); }

        // 패들 충돌: 맞은 위치에 따라 반사 각도 변경
        if (b.vy > 0 && b.y + BALL_R >= PADDLE_Y && b.y + BALL_R <= PADDLE_Y + PADDLE_H + 6 &&
            b.x >= paddle.x - paddle.w / 2 - BALL_R && b.x <= paddle.x + paddle.w / 2 + BALL_R) {
          const rel = (b.x - paddle.x) / (paddle.w / 2);
          const angle = Math.max(-1, Math.min(1, rel)) * (Math.PI / 3);
          const sp = speed();
          b.vx = Math.sin(angle) * sp; b.vy = -Math.cos(angle) * sp;
          b.y = PADDLE_Y - BALL_R;
        }

        // 벽돌 충돌
        for (const br of bricks) {
          if (!br.alive) continue;
          const cx = Math.max(br.x, Math.min(b.x, br.x + BRICK_W));
          const cy = Math.max(br.y, Math.min(b.y, br.y + BRICK_H));
          const dx = b.x - cx, dy = b.y - cy;
          if (dx * dx + dy * dy <= BALL_R * BALL_R) {
            if (Math.abs(dx) > Math.abs(dy)) { b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx); }
            else { b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy); }
            hitBrick(br);
            break;
          }
        }
      }
      if (b.y > H + BALL_R) b.dead = true;
    }
    balls = balls.filter(b => !b.dead);

    // 아이템
    for (const d of drops) {
      d.y += 2.5;
      if (d.y >= PADDLE_Y && d.y <= PADDLE_Y + PADDLE_H + 10 && Math.abs(d.x - paddle.x) <= paddle.w / 2 + 8) {
        d.got = true;
        if (d.type === 'wide') { paddle.w = BASE_PADDLE_W * 1.6; paddle.wideTimer = 60 * 12; }
        if (d.type === 'life') state.lives++;
        if (d.type === 'multi') {
          const src = balls.find(b => !b.stuck) || balls[0];
          if (src) for (let i = 0; i < 2; i++) {
            const a = -Math.PI / 2 + (i ? 0.5 : -0.5);
            balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * speed(), vy: Math.sin(a) * speed(), stuck: false });
          }
        }
        state.score += 25;
      }
    }
    drops = drops.filter(d => !d.got && d.y < H + 20);

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
    particles = particles.filter(p => p.life > 0);

    if (balls.length === 0) {
      state.lives--;
      if (state.lives <= 0) return gameOver();
      paddle.w = BASE_PADDLE_W; paddle.wideTimer = 0; drops = [];
      resetBall();
    }

    if (bricks.every(br => !br.alive)) {
      state.score += 100 * state.level;
      state.level++;
      running = false;
      saveBest();
      showOverlay(`레벨 ${state.level - 1} 클리어!`, `보너스 +${100 * (state.level - 1)}점<br>다음 레벨은 공이 더 빨라집니다.`, '다음 레벨');
      return;
    }
    updateHud();
  }

  function saveBest() {
    if (state.score > best) {
      best = state.score;
      try { localStorage.setItem('brick-best', best); } catch (e) {}
    }
    updateHud();
  }

  function gameOver() {
    running = false;
    saveBest();
    showOverlay('게임 오버', `최종 점수: <b style="color:var(--accent)">${state.score}</b><br>최고 점수: ${best}`, '다시 하기');
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (const br of bricks) {
      if (!br.alive) continue;
      ctx.fillStyle = br.color;
      ctx.globalAlpha = br.hp > 1 ? 1 : 0.85;
      roundRect(br.x, br.y, BRICK_W, BRICK_H, 4); ctx.fill();
      if (br.hp > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
      ctx.globalAlpha = p.life / 30; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    const dropColor = { wide: '#51cf66', multi: '#339af0', life: '#ff6b6b' };
    const dropLabel = { wide: '↔', multi: '●●', life: '♥' };
    for (const d of drops) {
      ctx.fillStyle = dropColor[d.type];
      ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(dropLabel[d.type], d.x, d.y + 1);
    }

    const grad = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    grad.addColorStop(0, '#ffe08a'); grad.addColorStop(1, '#f4a259');
    ctx.fillStyle = grad;
    roundRect(paddle.x - paddle.w / 2, PADDLE_Y, paddle.w, PADDLE_H, 6); ctx.fill();

    ctx.fillStyle = '#ffffff';
    for (const b of balls) { ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); ctx.fill(); }

    if (balls.some(b => b.stuck) && running) {
      ctx.fillStyle = 'rgba(232,235,255,.7)'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('클릭 또는 스페이스로 발사', W / 2, H / 2 + 60);
    }
    if (paused) {
      ctx.fillStyle = 'rgba(15,18,38,.6)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('일시정지', W / 2, H / 2);
    }
  }

  function loop() {
    if (running && !paused) update();
    draw();
    requestAnimationFrame(loop);
  }

  // 입력 처리
  function pointerToX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('mousemove', e => { paddle.x = pointerToX(e.clientX); });
  canvas.addEventListener('touchmove', e => { paddle.x = pointerToX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchstart', e => { paddle.x = pointerToX(e.touches[0].clientX); if (running) launch(); }, { passive: true });
  canvas.addEventListener('click', () => { if (running) launch(); });
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.code === 'Space') { e.preventDefault(); if (running) launch(); else ovBtn.click(); }
    if ((e.key === 'p' || e.key === 'P') && running) paused = !paused;
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  ovBtn.addEventListener('click', () => {
    if (!state || state.lives <= 0) newGame();
    else if (bricks.every(br => !br.alive)) loadLevel();
    overlay.classList.add('hidden');
    running = true; paused = false;
  });

  newGame();
  loop();
})();
</script>
</body>
</html>
